<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 56 804 228" width="804" height="228" role="img" aria-labelledby="title desc">
  <title id="title">SPDC experimental setup</title>
  <desc id="desc">A pump laser drives a type-II phase-matched SPDC crystal followed by a compensation crystal. The beam passes a half-wave plate at angle theta and is split by a polarizing beam splitter onto two bucket detectors.</desc>

  <defs>
    <style>
      .label   { font: 600 14px "Lato", "Inter", "Helvetica Neue", Arial, sans-serif; fill: #2f3640; }
      .sub     { font: 400 12px "Lato", "Inter", "Helvetica Neue", Arial, sans-serif; fill: #6b7280; }
      .tag     { font: 700 11px "Lato", "Inter", "Helvetica Neue", Arial, sans-serif; fill: #ffffff; }
      .math    { font: italic 400 13px "Times New Roman", serif; fill: #6b7280; }
    </style>

    <!-- soft beam glow -->
    <filter id="glow" x="-10%" y="-200%" width="120%" height="500%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>

    <linearGradient id="laserBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a4250"/>
      <stop offset="1" stop-color="#1f242c"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8f1fb"/>
      <stop offset="1" stop-color="#bcd4ec"/>
    </linearGradient>
    <linearGradient id="hwp" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7dd3c0"/>
      <stop offset="1" stop-color="#2a9d8f"/>
    </linearGradient>
    <radialGradient id="sensor" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#ffd27a"/>
      <stop offset="1" stop-color="#e07a1f"/>
    </radialGradient>

    <!-- periodic poling: alternating domains -->
    <pattern id="poling" width="16" height="10" patternUnits="userSpaceOnUse">
      <rect width="8" height="10" fill="#6c7ee1"/>
      <rect x="8" width="8" height="10" fill="#a78bfa"/>
    </pattern>
    <pattern id="comp" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="5" height="10" fill="#8b9cf0"/>
      <rect x="5" width="5" height="10" fill="#c4b5fd"/>
    </pattern>
  </defs>

  <!-- ===== Beam path ===== -->
  <g stroke="#ef4444" stroke-linecap="round" fill="none">
    <g filter="url(#glow)" stroke-width="7" opacity="0.35">
      <path d="M180 130 H 692"/>
      <path d="M584 130 V 238"/>
    </g>
    <g stroke-width="2.5">
      <path d="M180 130 H 692"/>
      <path d="M584 130 V 238"/>
    </g>
  </g>
  <!-- direction arrows -->
  <g fill="#ef4444">
    <path d="M205 124 l10 6 -10 6 z"/>
    <path d="M644 124 l10 6 -10 6 z"/>
    <path d="M578 200 l6 10 6 -10 z"/>
  </g>

  <!-- ===== Laser ===== -->
  <g filter="url(#shadow)">
    <rect x="30" y="96" width="150" height="68" rx="10" fill="url(#laserBody)"/>
  </g>
  <rect x="30" y="96" width="150" height="68" rx="10" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
  <rect x="44" y="108" width="6" height="44" rx="3" fill="#ffffff" opacity="0.08"/>
  <rect x="56" y="108" width="6" height="44" rx="3" fill="#ffffff" opacity="0.08"/>
  <rect x="68" y="108" width="6" height="44" rx="3" fill="#ffffff" opacity="0.08"/>
  <circle cx="156" cy="112" r="4" fill="#22c55e"/>
  <rect x="172" y="120" width="10" height="20" rx="3" fill="#11151b"/>
  <text class="label" x="105" y="84" text-anchor="middle">Pump laser</text>

  <!-- ===== SPDC crystal ===== -->
  <g filter="url(#shadow)">
    <rect x="240" y="104" width="120" height="52" rx="6" fill="url(#poling)"/>
  </g>
  <rect x="240" y="104" width="120" height="52" rx="6" fill="none" stroke="#4c5bc4" stroke-width="1.5"/>
  <rect x="240" y="104" width="120" height="14" rx="6" fill="#ffffff" opacity="0.18"/>
  <text class="label" x="300" y="84" text-anchor="middle">SPDC crystal</text>
  <text class="sub" x="300" y="180" text-anchor="middle">type-II phase-matched</text>

  <g transform="translate(20,0)">
  <!-- ===== Compensation crystal ===== -->
  <g filter="url(#shadow)">
    <rect x="378" y="112" width="56" height="36" rx="5" fill="url(#comp)"/>
  </g>
  <rect x="378" y="112" width="56" height="36" rx="5" fill="none" stroke="#6d7ad8" stroke-width="1.5"/>
  <rect x="378" y="112" width="56" height="10" rx="5" fill="#ffffff" opacity="0.2"/>
  <text class="label" x="406" y="84" text-anchor="middle">Compensation</text>
  <text class="sub" x="406" y="180" text-anchor="middle">walk-off correction</text>
  </g>

  <g transform="translate(24,0)">
  <!-- ===== HWP ===== -->
  <g filter="url(#shadow)">
    <rect x="474" y="100" width="12" height="60" rx="4" fill="url(#hwp)"/>
  </g>
  <rect x="474" y="100" width="12" height="60" rx="4" fill="none" stroke="#1f7a6f" stroke-width="1.2"/>
  <text class="label" x="480" y="84" text-anchor="middle">HWP</text>
  <text class="math" x="480" y="180" text-anchor="middle">ϑ</text>

  <!-- ===== PBS ===== -->
  <g filter="url(#shadow)">
    <rect x="530" y="100" width="60" height="60" rx="5" fill="url(#glass)"/>
  </g>
  <rect x="530" y="100" width="60" height="60" rx="5" fill="none" stroke="#7a9cc2" stroke-width="1.5"/>
  <path d="M533 103 L587 157" stroke="#4a6f99" stroke-width="2" stroke-linecap="round"/>
  <path d="M530 130 H 590 M560 130 V 160" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round"/>
  <text class="label" x="560" y="84" text-anchor="middle">PBS</text>

  <!-- polarization tags -->
  <g>
    <rect x="618" y="140" width="20" height="18" rx="9" fill="#2f3640"/>
    <text class="tag" x="628" y="153" text-anchor="middle">H</text>
    <rect x="572" y="182" width="20" height="18" rx="9" fill="#2f3640"/>
    <text class="tag" x="582" y="195" text-anchor="middle">V</text>
  </g>

  <!-- ===== Detector (transmitted) ===== -->
  <g filter="url(#shadow)">
    <rect x="668" y="98" width="10" height="64" rx="3" fill="#2f3640"/>
    <path d="M678 104 a 26 26 0 0 1 0 52 z" fill="url(#sensor)"/>
  </g>
  <text class="label" x="690" y="84" text-anchor="middle">D₁</text>

  <!-- ===== Detector (reflected) ===== -->
  <g filter="url(#shadow)">
    <rect x="528" y="238" width="64" height="10" rx="3" fill="#2f3640"/>
    <path d="M534 248 a 26 26 0 0 0 52 0 z" fill="url(#sensor)"/>
  </g>
  <text class="label" x="612" y="266">D₂</text>

  <text class="sub" x="690" y="186" text-anchor="middle">bucket detectors</text>
  </g>
</svg>
