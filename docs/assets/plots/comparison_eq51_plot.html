<html>
<head>
<link rel="stylesheet" href="../../stylesheets/coincidence_plots.css">
<style>
  /* Height follows the content; the iframe is resized to fit (fitFrame). */
  html, body, .plot-card { height: auto; }
  #main-matrix-plot, #sigma-q-plot { height: 380px; }
</style>
<meta charset="utf-8" />
<script charset="utf-8" src="https://cdn.plot.ly/plotly-3.5.0.min.js"></script>
</head>
<body>
<div class="plot-card">
  <div class="header">
    <div class="eyebrow">INTERACTIVE PLOT</div>
    <div id="readout" class="readout"></div>
  </div>

  <div class="controls">
    <div class="input-group">
      <span>λ</span>
      <div class="spinbox">
        <button
          onmousedown="startStepping('lam', -0.01)"
          onmouseup="stopStepping()"
          onmouseleave="stopStepping()"
          ontouchstart="startStepping('lam', -0.01)"
          ontouchend="stopStepping()"
        >-</button>
        <input id="lam" type="text" inputmode="decimal" value="0.6" oninput="updatePlot()">
        <button
          onmousedown="startStepping('lam', 0.01)"
          onmouseup="stopStepping()"
          onmouseleave="stopStepping()"
          ontouchstart="startStepping('lam', 0.01)"
          ontouchend="stopStepping()"
        >+</button>
      </div>
    </div>

    <div class="input-group">
      <span>η<sub>H</sub></span>
      <div class="spinbox">
        <button
          onmousedown="startStepping('etaH', -0.01)"
          onmouseup="stopStepping()"
          onmouseleave="stopStepping()"
          ontouchstart="startStepping('etaH', -0.01)"
          ontouchend="stopStepping()"
        >-</button>
        <input id="etaH" type="text" inputmode="decimal" value="0.7" oninput="updatePlot()">
        <button
          onmousedown="startStepping('etaH', 0.01)"
          onmouseup="stopStepping()"
          onmouseleave="stopStepping()"
          ontouchstart="startStepping('etaH', 0.01)"
          ontouchend="stopStepping()"
        >+</button>
      </div>
    </div>

    <div class="input-group">
      <span>η<sub>V</sub></span>
      <div class="spinbox">
        <button
          onmousedown="startStepping('etaV', -0.01)"
          onmouseup="stopStepping()"
          onmouseleave="stopStepping()"
          ontouchstart="startStepping('etaV', -0.01)"
          ontouchend="stopStepping()"
        >-</button>
        <input id="etaV" type="text" inputmode="decimal" value="0.45" oninput="updatePlot()">
        <button
          onmousedown="startStepping('etaV', 0.01)"
          onmouseup="stopStepping()"
          onmouseleave="stopStepping()"
          ontouchstart="startStepping('etaV', 0.01)"
          ontouchend="stopStepping()"
        >+</button>
      </div>
    </div>

    <div class="input-group">
      <span>ϑ</span>
      <div class="spinbox">
        <button
          onmousedown="startStepping('theta', -0.01)"
          onmouseup="stopStepping()"
          onmouseleave="stopStepping()"
          ontouchstart="startStepping('theta', -0.01)"
          ontouchend="stopStepping()"
        >-</button>
        <input id="theta" type="text" inputmode="decimal" value="0.37" oninput="updatePlot()">
        <button
          onmousedown="startStepping('theta', 0.01)"
          onmouseup="stopStepping()"
          onmouseleave="stopStepping()"
          ontouchstart="startStepping('theta', 0.01)"
          ontouchend="stopStepping()"
        >+</button>
      </div>
    </div>
  </div>

  <div class="plot-row">
    <div id="main-matrix-plot"></div>
    <div id="sigma-q-plot"></div>
  </div>

  <table class="result-table">
    <tr>
      <td>Main derivation: det(𝟙 − λ²MDMD)</td>
      <td id="det-main" class="num"></td>
      <td>P(0,0) = (1 − λ²) / √det(𝟙 − λ²MDMD)</td>
      <td id="p00-main" class="num"></td>
    </tr>
    <tr>
      <td>Gaussian formalism: (1 − λ²)² det σ′<sub>Q</sub></td>
      <td id="det-gauss" class="num"></td>
      <td>P(0,0) = 1 / √det σ′<sub>Q</sub></td>
      <td id="p00-gauss" class="num"></td>
    </tr>
  </table>
  <div id="difference" class="result-note"></div>
</div>
<script src="../../js/spdc_physics.js"></script>
<script src="../../js/comparison_eq51_plot.js"></script>
</body>
</html>
